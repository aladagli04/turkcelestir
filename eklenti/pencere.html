<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.45 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px 16px; color: #1d1d1f; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  kbd { background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .not { color: #666; font-size: 12px; }
  button { margin-top: 8px; padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #202124; color: #e8eaed; }
    kbd { background: #303134; border-color: #5f6368; }
    .not { color: #9aa0a6; }
    button { background: #303134; color: #e8eaed; border-color: #5f6368; }
  }
</style>
</head>
<body>
  <h1>Türkçeleştir</h1>
  <p>Yazı kutusunda <b>sağ tıkla → Türkçeleştir</b>.</p>
  <p>Kısayollar: <kbd id="k1">Alt+T</kbd> sadece karakterler, <kbd id="k2">Alt+Y</kbd> karakter + büyük harf + noktalama.</p>
  <p class="not">Metin seçiliyse yalnız seçili kısım, değilse kutunun tamamı düzelir. Beğenmezsen <kbd>Ctrl+Z</kbd>.
    Metin bilgisayarından dışarı çıkmaz.</p>
  <button id="kisayol">Kısayolları değiştir</button>
  <script src="pencere.js"></script>
</body>
</html>
